services:
  monotes:
    container_name: monotes-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 6969:7999
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/curl", "-f", "http://0.0.0.0:7999/health"]
    tty: true
    stdin_open: true
    networks:
      - default

networks:
  default:
    name: monotes-network
    external: false
